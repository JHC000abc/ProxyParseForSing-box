name: Timed Scheduling
on:
  workflow_dispatch:
  push:
    branches: [ main,master ]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai  # 确保容器内的时间命令默认使用东八区

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y \
          curl \
          git \
          && apt-get clean \
          && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，防止 git 报错

      - name: RUN AND PUSH NODES
        shell: bash
        run: |
          if [ -d configs ]; then
            rm -rf configs
          fi
          mkdir -p configs
          echo "🚀 开始执行主程序..."
          ./main

      - name: Commit and Push
        run: |
          git config --global --add safe.directory '*'
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 使用 -A 确保删除的文件也能被 git 追踪并提交
          git add -A
          git commit -m "Update nodes and clean invalid configs [skip ci]" || exit 0
          git push

      - name: Create summary
        run: |
          echo "### 🎉 Build Successful" >> $GITHUB_STEP_SUMMARY
name: Update sing-box config

on:
  # 每 2 小时自动运行一次（UTC 时间，整点触发）
  schedule:
    - cron: '0 */2 * * *'
  # 手动触发（在 Actions 页面点 "Run workflow"）
  workflow_dispatch:
  # 推送 main.py 或依赖变更时也跑一次
  push:
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/update.yml'

# 推送 config.json 回仓库需要写权限
permissions:
  contents: write

# 防止定时任务叠加执行
concurrency:
  group: update-singbox-config
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------- 1. 检出仓库 ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 允许后续 git push 使用 GITHUB_TOKEN
          persist-credentials: true

      # ---------- 2. 安装 Python ----------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ---------- 3. 安装依赖 ----------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- 4. 运行转换脚本 ----------
      - name: Run parser
        env:
          # 优先读 secret，没有则用 main.py 内置默认
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          python main.py --port 1080 -o config.json
          echo "----- config.json 前 30 行 -----"
          head -n 30 config.json

      # ---------- 5. 用 sing-box 官方校验器检查配置 ----------
      - name: Validate with sing-box
        run: |
          set -e
          # 下载 sing-box 1.8.8 官方二进制做静态校验
          SB_VER=1.8.8
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          /tmp/sing-box-${SB_VER}-linux-amd64/sing-box check -c config.json
          echo "✅ sing-box check passed"

      # ---------- 6. 提交 config.json（仅在内容变化时） ----------
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- config.json; then
            echo "config.json 无变化，跳过提交"
          else
            git add config.json
            git commit -m "chore: auto-update config.json $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "✅ 已提交更新"
          fi

      # ---------- 7. 上传 artifact 作为备份 ----------
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singbox-config
          path: config.json
          retention-days: 7
